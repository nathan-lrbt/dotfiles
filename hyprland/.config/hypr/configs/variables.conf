# --- Theme ---
env = GTK_THEME,Catppuccin-Mauve-Dark-Macchiato
env = GTK_APPLICATION_PREFER_DARK_THEME,1
env = XDG_CURRENT_DESKTOP,Hyprland

# --- Cursor ---
env = XCURSOR_THEME,phinger-cursors-dark
env = XCURSOR_SIZE,24

# --- GTK2 Support ---
env = GTK2_RC_FILES,"$HOME/.config/gtk-2.0/gtkrc"

# --- Qt (use GTK theme) ---
env = QT_QPA_PLATFORMTHEME,gtk
env = QT_STYLE_OVERRIDE,Adwaita-dark

# --- GDK scaling / DPI ---
env = GDK_SCALE,1
env = GDK_DPI_SCALE,1

# --- Ensure apps launched from launchers follow this ---
env = DESKTOP_SESSION,hyprland

# remove env prefix in prompt
env = CONDA_CHANGEPS1,false

# --- Hyprshot ---
env = HYPRSHOT_DIR,"$HOME/Pictures/Screenshots"

# --- Default dirs ---
env = XDG_PICTURES_DIR,"$HOME/Pictures"

